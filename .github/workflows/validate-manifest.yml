name: validate-manifest

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'skills/arabic-editing-skill/scripts/**'
      - 'skills/arabic-editing-skill/references/change_manifest.schema.json'
  pull_request:
    paths:
      - 'skills/arabic-editing-skill/scripts/**'
      - 'skills/arabic-editing-skill/references/change_manifest.schema.json'
  workflow_dispatch:

jobs:
  test:
    name: Run manifest validator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate JSON schema
        run: python -c "import json; json.load(open('skills/arabic-editing-skill/references/change_manifest.schema.json', encoding='utf-8'))"

      - name: Run validator tests
        run: python skills/arabic-editing-skill/scripts/test_validate_manifest.py
